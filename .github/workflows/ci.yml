name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: sinotaris_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sinotaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sinotaris_ci -d sinotaris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://sinotaris_ci:ci-only-password@127.0.0.1:5432/sinotaris_test
        run: npm ci

      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://sinotaris_ci:ci-only-password@127.0.0.1:5432/sinotaris_test
        run: npx prisma migrate deploy

      - name: Run integration database guard tests
        run: npm run test:integration:guard

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://sinotaris_ci:ci-only-password@127.0.0.1:5432/sinotaris_test
          NODE_ENV: test
        run: npm run test:integration

      - name: Run archive parser tests
        run: npm run test:archive-parser

      - name: Run lint checks
        run: npm run lint

      - name: Run type checks
        run: npx tsc --noEmit

      - name: Build application
        env:
          DATABASE_URL: postgresql://sinotaris_ci:ci-only-password@127.0.0.1:5432/sinotaris_test
          AUTH_SECRET: ci-only-auth-secret-not-valid-outside-github-actions
        run: npm run build
